<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Record a milk collection entry for a farmer." />
  <title>Record Milk Collection - Dairy Milk Collection Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body" data-page="collection">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="content-toolbar">
        <div>
          <h2>Record Milk Collection</h2>
          <p>The amount is calculated automatically from the current milk rate.</p>
        </div>
      </div>

      <div class="card mb-24">
        <div class="card-body">
          <form id="collectionForm" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="farmerSelect">Farmer</label>
                <select id="farmerSelect" class="form-control" required>
                  <option value="">Loading farmers...</option>
                </select>
              </div>
              <div class="form-group">
                <label for="dateInput">Date</label>
                <input type="date" id="dateInput" class="form-control" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="shiftSelect">Shift</label>
                <select id="shiftSelect" class="form-control" required>
                  <option value="Morning">Morning</option>
                  <option value="Evening">Evening</option>
                </select>
              </div>
              <div class="form-group">
                <label for="milkTypeSelect">Milk Type</label>
                <select id="milkTypeSelect" class="form-control" required>
                  <option value="Cow">Cow</option>
                  <option value="Buffalo">Buffalo</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="litersInput">Liters</label>
                <input type="number" id="litersInput" class="form-control" placeholder="e.g. 12.5" step="0.01" min="0.01" required />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="fatInput">Fat (%)</label>
                  <input type="number" id="fatInput" class="form-control" placeholder="e.g. 4.1" step="0.01" min="0" max="100" required />
                </div>
                <div class="form-group">
                  <label for="snfInput">SNF (%)</label>
                  <input type="number" id="snfInput" class="form-control" placeholder="e.g. 8.5" step="0.01" min="0" max="100" required />
                </div>
              </div>
            </div>

            <div class="amount-preview mb-16" id="amountPreview">
              <div>
                <div class="label">Payable amount</div>
                <div class="small muted" id="rateNote">Current rate applies</div>
              </div>
              <div class="value" id="amountValue">&#8377;0.00</div>
            </div>

            <div id="collectionFeedback" class="form-feedback"></div>
            <button type="submit" class="btn btn-primary btn-block" id="collectionSubmitBtn">Save Collection</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Today's Collections</h2>
          <span class="muted small" id="todayCount"></span>
        </div>
        <div class="card-body" style="padding-top: 12px;">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Farmer</th>
                  <th>Shift</th>
                  <th>Type</th>
                  <th class="num">Liters</th>
                  <th class="num">Fat %</th>
                  <th class="num">SNF %</th>
                  <th class="num">Rate</th>
                  <th class="num">Amount</th>
                </tr>
              </thead>
              <tbody id="todayTableBody">
                <tr><td colspan="8" class="loading-row">Loading...</td></tr>
              </tbody>
              <tfoot id="todayTableFoot" style="display: none;">
                <tr>
                  <td colspan="3">Total</td>
                  <td class="num" id="todayTotalLiters"></td>
                  <td colspan="3"></td>
                  <td class="num" id="todayTotalAmount"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
