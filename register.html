<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <meta name="description" content="Register your dairy to start recording daily milk collections." />
  <title>Register - Dairy Milk Collection Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

  <main class="auth-card wide">
    <div class="auth-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6 6.3 6 10.8a6 6 0 1 1-12 0C6 9 12 2.7 12 2.7z"/></svg>
      </span>
      <h1>Dairy Milk Collection Management System</h1>
      <p>Register your dairy to get started</p>
    </div>

    <div id="formFeedback" class="form-feedback"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="dairyName">Dairy Name</label>
        <input type="text" id="dairyName" class="form-control" placeholder="e.g. Sunrise Dairy" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ownerName">Owner Name</label>
          <input type="text" id="ownerName" class="form-control" placeholder="Your full name" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210" required />
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" class="form-control" placeholder="Dairy address" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register Your Dairy</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
