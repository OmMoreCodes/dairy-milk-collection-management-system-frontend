<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <meta name="description" content="Generate a payment statement for a single farmer." />
  <title>Farmer Statement - Dairy Milk Collection Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body" data-page="statement">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="content-toolbar">
        <div>
          <h2>Farmer Statement</h2>
          <p>A period-wise milk collection and payment statement for a single farmer.</p>
        </div>
      </div>

      <div class="card mb-20">
        <div class="card-body">
          <form class="filter-bar" id="statementForm" novalidate>
            <div class="form-group" style="min-width: 260px;">
              <label for="farmerSelect">Farmer</label>
              <select id="farmerSelect" class="form-control" required>
                <option value="">Select a farmer</option>
              </select>
            </div>
            <div class="form-group">
              <label for="fromInput">From</label>
              <input type="date" id="fromInput" class="form-control" required />
            </div>
            <div class="form-group">
              <label for="toInput">To</label>
              <input type="date" id="toInput" class="form-control" required />
            </div>
            <div class="filter-actions">
              <button type="submit" class="btn btn-primary">Generate Statement</button>
              <button type="button" class="btn btn-outline" id="pdfBtn">Export PDF</button>
            </div>
          </form>
        </div>
      </div>

      <div id="statementResult"></div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/statement.js"></script>
</body>
</html>
